# GitHub Actions workflow for deploying static content to GitHub Pages
name: Deploy to GitHub Pages

on:
  # Trigger workflow on pushes to the main branch
  push:
    branches: [main]

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Set required permissions for GitHub Pages deployment
permissions:
  contents: read    # Read repository content
  pages: write      # Write access to GitHub Pages
  id-token: write   # Access for authentication

# Configure concurrency to ensure one deployment at a time
concurrency:
  group: "pages"              # Group deployments under "pages"
  cancel-in-progress: true    # Cancel ongoing deployments if a new one starts

# Environment variables to optimize memory usage
env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  deploy:
    # Configure deployment environment for GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Use GitHub-hosted runner
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x    # Use Node.js version 18
          cache: yarn           # Cache dependencies for faster builds

      # Step 3: Install dependencies with Yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      # Step 4: Build the project
      - name: Build project
        run: yarn build

      # Step 5: Verify build directory (for debugging)
      - name: Verify build directory
        run: ls -la build

      # Step 6: Configure GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v2

      # Step 7: Upload build artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts   # Name of the uploaded artifact
          path: build             # Path to the build directory

      # Step 8: Download build artifacts (new step added)
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts   # Name of the artifact to download
          path: build             # Path to extract the artifact
      
      # adding some debug steps 
      - name: Check GITHUB_TOKEN Permissions
        run: |
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/pages
      
      - name: Debug - List uploaded artifacts
        run: |
          echo "Artifacts directory content:"
          ls -la build

      - name: Debug GITHUB_RUN_ID
        run: 
          echo ${{ github.run_id }}

      # Step 9: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        #id: deployment
        uses: actions/deploy-pages@v3
