name: Deploy to GitHub Pages (Latest)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Latest v4
      - name: Set up Node.js
        uses: actions/setup-node@v4 # Latest v4
        with:
          node-version: 18.x
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Build project
        run: yarn build
      - name: Verify build directory
        run: ls -la build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v3 # Latest v3
      # Step 7: Upload build artifacts (Corrected)
      - name: Upload build artifacts
        uses: actions/upload-pages-artifact@v3 # Latest v3
        with:
          path: build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3 # Latest v3